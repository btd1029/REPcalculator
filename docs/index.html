<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物件スコアラー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f3f4f6; font-family: 'Helvetica Neue', Arial, sans-serif; color: #1f2937; }
  h1 { font-size: 1.4rem; font-weight: 700; color: #2563eb; }
  h2 { font-size: 1rem; font-weight: 600; color: #374151; margin-bottom: 12px; }
  .container { max-width: 640px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 16px; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  #settings-toggle { background: none; border: 1px solid #d1d5db; border-radius: 6px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; color: #6b7280; }
  #settings-toggle:hover { background: #f9fafb; }
  #settings-body { margin-top: 12px; }
  #settings-body.hidden { display: none; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 500; color: #374151; margin-bottom: 4px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid #d1d5db; border-radius: 6px;
    padding: 8px 10px; font-size: 0.9rem; color: #1f2937; transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #2563eb; }
  .btn { display: inline-block; padding: 9px 20px; border-radius: 7px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: background 0.15s; }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .btn-save { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  .btn-save:hover { background: #e5e7eb; }
  #drop-zone {
    border: 2px dashed #93c5fd; border-radius: 10px; padding: 36px 20px;
    text-align: center; cursor: pointer; color: #6b7280; font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s; position: relative;
  }
  #drop-zone:hover, #drop-zone.dragover { background: #eff6ff; border-color: #2563eb; }
  #drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  #preview-wrap { margin-top: 14px; text-align: center; display: none; }
  #preview-wrap img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid #e5e7eb; }
  .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 3px solid #bfdbfe; border-top-color: #2563eb;
    border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #extract-status { font-size: 0.85rem; color: #6b7280; margin-top: 8px; min-height: 20px; }
  #confirm-section { display: none; }
  .section-title { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin: 16px 0 10px; }
  .checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .checkbox-item { display: flex; align-items: flex-start; gap: 7px; font-size: 0.88rem; cursor: pointer; }
  .checkbox-item input[type=checkbox] { margin-top: 2px; accent-color: #2563eb; flex-shrink: 0; }
  .hard-filter { color: #dc2626; font-weight: 600; }
  .banner { border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; font-size: 0.88rem; line-height: 1.5; display: none; }
  .banner.success { background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
  .banner.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .banner a { color: inherit; text-decoration: underline; }
  .fields-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  @media (max-width: 480px) { .fields-2col { grid-template-columns: 1fr; } .checkbox-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="header">
      <h1>物件スコアラー</h1>
      <button id="settings-toggle">&#9881; 設定</button>
    </div>
    <div id="settings-body" class="hidden">
      <div class="field">
        <label>Claude APIキー</label>
        <input type="password" id="s-claude-key" placeholder="sk-ant-..." autocomplete="off">
      </div>
      <div class="field">
        <label>GitHub PAT</label>
        <input type="password" id="s-gh-token" placeholder="ghp_..." autocomplete="off">
      </div>
      <div class="field">
        <label>リポジトリ</label>
        <input type="text" id="s-repo" value="btd1029/REPcalculator">
      </div>
      <div class="field">
        <label>ブランチ</label>
        <input type="text" id="s-branch" value="main">
      </div>
      <button class="btn btn-save" id="btn-save-settings">保存</button>
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <div class="card">
    <h2>物件スクリーンショット</h2>
    <div id="drop-zone">
      <input type="file" id="file-input" accept="image/*,application/pdf">
      <div id="drop-label">ここにドロップ、クリック、またはCtrl+Vで貼り付け<br><span style="font-size:0.78rem;color:#9ca3af">画像（PNG/JPG/WebP）またはPDF</span></div>
    </div>
    <div id="preview-wrap">
      <img id="preview-img" src="" alt="プレビュー">
      <div id="pdf-label" style="display:none;margin-top:8px;font-size:0.85rem;color:#6b7280;"></div>
    </div>
    <div style="margin-top:14px;">
      <button class="btn btn-primary" id="btn-extract" disabled>画像から抽出する</button>
      <div id="extract-status"></div>
    </div>
  </div>

  <div class="card" id="confirm-section">
    <h2>確認・編集</h2>
    <div class="section-title">基本情報</div>
    <div class="field"><label>物件名 *</label><input type="text" id="f-name" required></div>
    <div class="fields-2col">
      <div class="field"><label>価格（万円）</label><input type="number" id="f-price_man"></div>
      <div class="field"><label>管理費+修繕積立（万円/月）</label><input type="number" id="f-monthly_fee_man" step="0.1"></div>
      <div class="field"><label>面積（㎡）</label><input type="number" id="f-area_m2" step="0.1"></div>
      <div class="field"><label>築年数</label><input type="number" id="f-age_years"></div>
      <div class="field"><label>階数</label><input type="number" id="f-floor_level"></div>
      <div class="field"><label>総階数</label><input type="number" id="f-total_floors"></div>
      <div class="field">
        <label>方角</label>
        <select id="f-direction">
          <option value="">-</option>
          <option>南</option><option>南東</option><option>南西</option>
          <option>東</option><option>西</option><option>北東</option><option>北西</option><option>北</option>
        </select>
      </div>
      <div class="field"><label>駅徒歩（分）</label><input type="number" id="f-walk_to_station"></div>
      <div class="field"><label>駅名</label><input type="text" id="f-station_name"></div>
    </div>
    <div class="field">
      <label>住所</label>
      <div style="display:flex;gap:8px;align-items:center;">
        <input type="text" id="f-address" style="flex:1">
        <button type="button" class="btn btn-save" id="btn-geocode" style="white-space:nowrap;flex-shrink:0;">📍 取得</button>
      </div>
      <div id="geocode-status" style="font-size:0.8rem;color:#6b7280;margin-top:4px;min-height:16px;"></div>
    </div>
    <div class="fields-2col">
      <div class="field"><label>緯度</label><input type="number" id="f-lat" step="0.0001"></div>
      <div class="field"><label>経度</label><input type="number" id="f-lng" step="0.0001"></div>
    </div>
    <div id="dist-status" style="font-size:0.8rem;color:#6b7280;margin-top:4px;min-height:16px;"></div>
    <div class="field">
      <label>ハザードリスク（0=安全〜5=高リスク）</label>
      <input type="number" id="f-hazard_risk" min="0" max="5" step="1" placeholder="国土交通省ハザードマップで確認">
    </div>
    <div class="field"><label>物件URL</label><input type="text" id="f-source_url"></div>

    <div class="section-title">設備（SUUMO条件）</div>
    <div class="checkbox-grid">
      <label class="checkbox-item hard-filter"><input type="checkbox" id="f-pet_allowed"> ペット可 ★（ハードフィルター・赤ラベル）</label>
      <label class="checkbox-item"><input type="checkbox" id="f-renovation"> リノベ済み</label>
      <label class="checkbox-item"><input type="checkbox" id="f-delivery_box"> 宅配ボックス</label>
      <label class="checkbox-item"><input type="checkbox" id="f-bathroom_dryer"> 浴室乾燥機</label>
      <label class="checkbox-item"><input type="checkbox" id="f-walk_in_closet"> ウォークインクローゼット</label>
      <label class="checkbox-item"><input type="checkbox" id="f-auto_lock"> オートロック</label>
      <label class="checkbox-item"><input type="checkbox" id="f-elevator"> エレベーター</label>
      <label class="checkbox-item"><input type="checkbox" id="f-parking"> 駐車場</label>
      <label class="checkbox-item"><input type="checkbox" id="f-bike_parking"> 駐輪場</label>
      <label class="checkbox-item"><input type="checkbox" id="f-floor_heating"> 床暖房</label>
      <label class="checkbox-item"><input type="checkbox" id="f-system_kitchen"> システムキッチン</label>
      <label class="checkbox-item"><input type="checkbox" id="f-dishwasher"> 食洗機</label>
      <label class="checkbox-item"><input type="checkbox" id="f-monitor_intercom"> モニター付インターホン</label>
      <label class="checkbox-item"><input type="checkbox" id="f-security_camera"> 防犯カメラ</label>
      <label class="checkbox-item"><input type="checkbox" id="f-new_earthquake_standard"> 新耐震基準</label>
      <label class="checkbox-item"><input type="checkbox" id="f-corner_unit"> 角部屋</label>
      <label class="checkbox-item"><input type="checkbox" id="f-top_floor"> 最上階</label>
    </div>

    <div class="section-title">メモ</div>
    <div class="field"><textarea id="f-memo" rows="3" placeholder="自由記述..."></textarea></div>

    <div style="margin-top: 16px;">
      <button class="btn btn-primary" id="btn-commit">確定・保存</button>
    </div>
  </div>
</div>

<script>
// ---- Settings ----
function loadSettings() {
  document.getElementById('s-claude-key').value = localStorage.getItem('claude-key') || '';
  document.getElementById('s-gh-token').value = localStorage.getItem('gh-token') || '';
  document.getElementById('s-repo').value = localStorage.getItem('repo') || 'btd1029/REPcalculator';
  document.getElementById('s-branch').value = localStorage.getItem('branch') || 'main';
}
function getSetting(k, def) { return localStorage.getItem(k) || def || ''; }

document.getElementById('settings-toggle').addEventListener('click', function() {
  document.getElementById('settings-body').classList.toggle('hidden');
});
document.getElementById('btn-save-settings').addEventListener('click', function() {
  localStorage.setItem('claude-key', document.getElementById('s-claude-key').value.trim());
  localStorage.setItem('gh-token', document.getElementById('s-gh-token').value.trim());
  localStorage.setItem('repo', document.getElementById('s-repo').value.trim());
  localStorage.setItem('branch', document.getElementById('s-branch').value.trim());
  document.getElementById('settings-body').classList.add('hidden');
  showBanner('設定を保存しました', 'success', 2000);
});
loadSettings();

// ---- File handling (image or PDF) ----
var currentBase64 = null;
var currentMime = null;
var currentFileType = null; // 'image' or 'pdf'

function setFile(file) {
  if (!file) return;
  var isImage = file.type.startsWith('image/');
  var isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  if (!isImage && !isPdf) return;

  currentMime = isImage ? file.type : 'application/pdf';
  currentFileType = isImage ? 'image' : 'pdf';

  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    currentBase64 = dataUrl.split(',')[1];
    document.getElementById('btn-extract').disabled = false;
    document.getElementById('drop-label').textContent = file.name;

    var previewWrap = document.getElementById('preview-wrap');
    var previewImg = document.getElementById('preview-img');
    var pdfLabel = document.getElementById('pdf-label');
    previewWrap.style.display = 'block';

    if (isImage) {
      previewImg.src = dataUrl;
      previewImg.style.display = 'block';
      pdfLabel.style.display = 'none';
    } else {
      previewImg.style.display = 'none';
      pdfLabel.style.display = 'block';
      pdfLabel.textContent = '📄 ' + file.name + '（' + (file.size / 1024).toFixed(0) + ' KB）';
    }
  };
  reader.readAsDataURL(file);
}

// keep backward compat alias
function setImage(file) { setFile(file); }

var dropZone = document.getElementById('drop-zone');
var fileInput = document.getElementById('file-input');

fileInput.addEventListener('change', function() { if (fileInput.files[0]) setFile(fileInput.files[0]); });

dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); dropZone.classList.remove('dragover');
  var f = e.dataTransfer.files[0]; if (f) setImage(f);
});

window.addEventListener('paste', function(e) {
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.startsWith('image/') || items[i].type === 'application/pdf') {
      setFile(items[i].getAsFile()); break;
    }
  }
});

// ---- Extract ----
document.getElementById('btn-extract').addEventListener('click', async function() {
  var apiKey = getSetting('claude-key');
  if (!apiKey) { showBanner('Claude APIキーを設定してください', 'error'); return; }
  if (!currentBase64) { showBanner('画像を選択してください', 'error'); return; }

  var btn = document.getElementById('btn-extract');
  var status = document.getElementById('extract-status');
  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span>抽出中...';

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-opus-4-5',
        max_tokens: 1024,
        messages: [{
          role: 'user',
          content: [
            currentFileType === 'pdf'
              ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: currentBase64 } }
              : { type: 'image',    source: { type: 'base64', media_type: currentMime,        data: currentBase64 } },
            {
              type: 'text',
              text: '以下のSUUMO物件情報（スクリーンショットまたはPDF）から情報をJSONで抽出してください。\n不明な項目はnullにしてください。boolean項目は記載があればtrue、なければfalse。\nmonthly_fee_manは管理費と修繕積立金の合計（万円/月、数値）。\nmemoには以下を日本語50字以内で簡潔にまとめてください：①一般的でない珍しい設備・特徴、②欠陥・デメリット（旧耐震・修繕積立金不足・訳あり等）、③その他の特記事項。特記事項がなければnull。\n\n{"name":"物件名","price_man":数値,"monthly_fee_man":数値,"area_m2":数値,"age_years":数値,"floor_level":数値,"total_floors":数値,"direction":"南/南東/南西/東/西/北東/北西/北","walk_to_station":数値,"station_name":"駅名","address":"住所","source_url":null,"memo":"特記事項","pet_allowed":bool,"renovation":bool,"delivery_box":bool,"bathroom_dryer":bool,"walk_in_closet":bool,"auto_lock":bool,"elevator":bool,"parking":bool,"bike_parking":bool,"floor_heating":bool,"system_kitchen":bool,"dishwasher":bool,"monitor_intercom":bool,"security_camera":bool,"new_earthquake_standard":bool,"corner_unit":bool,"top_floor":bool}\n\nJSONのみ返してください。'
            }
          ]
        }]
      })
    });

    if (!res.ok) {
      var err = await res.json().catch(function() { return {}; });
      throw new Error((err.error && err.error.message) || ('HTTP ' + res.status));
    }

    var data = await res.json();
    var text = data.content[0].text.trim();
    text = text.replace(/^```[a-z]*\n?/i, '').replace(/```\s*$/, '').trim();
    var parsed = JSON.parse(text);
    populateForm(parsed);
    document.getElementById('confirm-section').style.display = 'block';
    document.getElementById('confirm-section').scrollIntoView({ behavior: 'smooth' });
    status.innerHTML = '&#10003; 抽出完了';
  } catch (e) {
    status.innerHTML = '';
    showBanner('抽出エラー: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// ---- Form ----
var boolFields = ['pet_allowed','renovation','delivery_box','bathroom_dryer','walk_in_closet','auto_lock','elevator','parking','bike_parking','floor_heating','system_kitchen','dishwasher','monitor_intercom','security_camera','new_earthquake_standard','corner_unit','top_floor'];
var textFields = ['name','station_name','address','source_url'];
var numFields = ['price_man','monthly_fee_man','area_m2','age_years','floor_level','total_floors','walk_to_station','hazard_risk'];

function populateForm(d) {
  textFields.forEach(function(k) { var el = document.getElementById('f-'+k); if (el) el.value = d[k] != null ? d[k] : ''; });
  numFields.forEach(function(k) { var el = document.getElementById('f-'+k); if (el) el.value = d[k] != null ? d[k] : ''; });
  var dir = document.getElementById('f-direction');
  if (dir && d.direction) dir.value = d.direction;
  boolFields.forEach(function(k) { var el = document.getElementById('f-'+k); if (el) el.checked = !!d[k]; });
  ['lat','lng'].forEach(function(k) { var el = document.getElementById('f-'+k); if (el) el.value = d[k] != null ? d[k] : ''; });
  var memo = document.getElementById('f-memo'); if (memo) memo.value = d.memo != null ? d.memo : '';
  // 住所があり緯度経度が未設定なら自動ジオコーディング
  if (d.address && !d.lat && !d.lng) {
    var status = document.getElementById('geocode-status');
    status.textContent = '住所から自動取得中...';
    geocodeAddress(d.address).then(function(coords) {
      document.getElementById('f-lat').value = coords.lat.toFixed(6);
      document.getElementById('f-lng').value = coords.lng.toFixed(6);
      status.textContent = '✓ ' + coords.lat.toFixed(6) + ', ' + coords.lng.toFixed(6);
      onLatLngReady(coords.lat, coords.lng);
    }).catch(function(e) {
      status.textContent = '⚠ 自動取得失敗。📍ボタンで再試行してください';
    });
  }
}

function getFormData() {
  var d = {};
  textFields.forEach(function(k) { var el = document.getElementById('f-'+k); d[k] = el && el.value.trim() ? el.value.trim() : null; });
  numFields.forEach(function(k) { var el = document.getElementById('f-'+k); d[k] = el && el.value !== '' ? parseFloat(el.value) : null; });
  var dir = document.getElementById('f-direction');
  d.direction = dir && dir.value ? dir.value : null;
  boolFields.forEach(function(k) { var el = document.getElementById('f-'+k); d[k] = el ? el.checked : false; });
  ['lat','lng'].forEach(function(k) { var el = document.getElementById('f-'+k); d[k] = el && el.value !== '' ? parseFloat(el.value) : null; });
  d.memo = document.getElementById('f-memo').value.trim() || null;
  // 距離データをマージ
  var dist = window._lastDistances || {};
  d.supermarket_dist_m = dist.supermarket_dist_m != null ? dist.supermarket_dist_m : null;
  d.hospital_dist_m = dist.hospital_dist_m != null ? dist.hospital_dist_m : null;
  d.convenience_store_dist_m = dist.convenience_store_dist_m != null ? dist.convenience_store_dist_m : null;
  d.park_dist_m = dist.park_dist_m != null ? dist.park_dist_m : null;
  d.school_dist_m = dist.school_dist_m != null ? dist.school_dist_m : null;
  return d;
}

// ---- YAML builder ----
function toYaml(id, d) {
  var allFields = ['name','price_man','monthly_fee_man','area_m2','age_years','floor_level','total_floors','direction','walk_to_station','station_name','address','lat','lng','supermarket_dist_m','hospital_dist_m','convenience_store_dist_m','park_dist_m','school_dist_m','hazard_risk','source_url'].concat(boolFields).concat(['memo']);
  var lines = ['id: ' + id];
  allFields.forEach(function(k) {
    var v = d[k];
    if (v === null || v === undefined) { lines.push(k + ': null'); }
    else if (typeof v === 'boolean') { lines.push(k + ': ' + v); }
    else if (typeof v === 'number') { lines.push(k + ': ' + v); }
    else { lines.push(k + ': "' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'); }
  });
  return lines.join('\n') + '\n';
}

// ---- Commit ----

// ranking.html の埋め込みデータから物件名で重複チェック（API不要）
var _cachedProperties = null;
async function loadExistingProperties() {
  if (_cachedProperties) return _cachedProperties;
  try {
    var res = await fetch('ranking.html?_=' + Date.now());
    if (!res.ok) return [];
    var html = await res.text();
    var m = html.match(/\/\* __PROPERTIES__ \*\/(\[.*?\]);/s);
    _cachedProperties = m ? JSON.parse(m[1]) : [];
  } catch(e) { _cachedProperties = []; }
  return _cachedProperties;
}

async function findDuplicate(token, repo, branch, name, sourceUrl) {
  var props = await loadExistingProperties();
  for (var i = 0; i < props.length; i++) {
    var p = props[i];
    var nameMatch = p.name && p.name === name;
    var urlMatch  = sourceUrl && p.source_url && p.source_url === sourceUrl;
    if (nameMatch || urlMatch) {
      // SHAはGitHub APIで1件だけ取得
      var path = 'properties/' + p.id + '.yaml';
      var shaRes = await fetch(
        'https://api.github.com/repos/' + repo + '/contents/' + path + '?ref=' + encodeURIComponent(branch),
        { headers: { Authorization: 'Bearer ' + token } }
      );
      var sha = shaRes.ok ? (await shaRes.json()).sha : undefined;
      return { id: p.id, path: path, sha: sha };
    }
  }
  return null;
}

document.getElementById('btn-commit').addEventListener('click', async function() {
  var token = getSetting('gh-token');
  var repo = getSetting('repo', 'btd1029/REPcalculator');
  var branch = getSetting('branch', 'main');
  if (!token) { showBanner('GitHub PATを設定してください', 'error'); return; }

  var d = getFormData();
  if (!d.name) { showBanner('物件名は必須です', 'error'); return; }

  var btn = document.getElementById('btn-commit');
  btn.disabled = true;

  try {
    // 重複チェック
    showBanner('<span class="spinner"></span>重複チェック中...', 'success');
    var dup = await findDuplicate(token, repo, branch, d.name, d.source_url);

    var id, path, existingSha;
    if (dup) {
      var overwrite = confirm('「' + d.name + '」は既に登録されています（ID: ' + dup.id + '）。\n上書き保存しますか？');
      if (!overwrite) { showBanner('保存をキャンセルしました', 'error', 2000); return; }
      id = dup.id;
      path = dup.path;
      existingSha = dup.sha;
    } else {
      id = (Date.now().toString(36) + Math.random().toString(36).slice(2, 6)).slice(0, 8);
      path = 'properties/' + id + '.yaml';
      existingSha = undefined;
    }

    var yaml = toYaml(id, d);
    var content = btoa(unescape(encodeURIComponent(yaml)));
    var apiBase = 'https://api.github.com/repos/' + repo + '/contents/' + path;

    var body = {
      message: (dup ? 'Update' : 'Add') + ' property: ' + d.name,
      content: content,
      branch: branch
    };
    if (existingSha) body.sha = existingSha;

    var putRes = await fetch(apiBase, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!putRes.ok) {
      var perr = await putRes.json().catch(function() { return {}; });
      throw new Error(perr.message || ('HTTP ' + putRes.status));
    }

    var parts = repo.split('/');
    var owner = parts[0]; var reponame = parts[1];
    var actionsUrl = 'https://github.com/' + repo + '/actions';
    var rankingUrl = 'https://' + owner + '.github.io/' + reponame + '/ranking.html';
    showBanner(
      (dup ? '上書き' : '保存') + 'しました！ ID: <b>' + id + '</b><br>' +
      '<a href="' + actionsUrl + '" target="_blank">Actions を確認</a> ／ ' +
      '<a href="' + rankingUrl + '" target="_blank">ランキングを見る</a>',
      'success'
    );
  } catch (e) {
    showBanner('コミットエラー: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
});

// ---- Geocoding（国土地理院API）----
async function geocodeAddress(address) {
  var url = 'https://msearch.gsi.go.jp/address-search/AddressSearch?q=' + encodeURIComponent(address);
  var res = await fetch(url, { timeout: 10000 });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var data = await res.json();
  if (!data || data.length === 0) throw new Error('住所が見つかりませんでした');
  var coords = data[0].geometry.coordinates; // [lng, lat]
  return { lat: coords[1], lng: coords[0] };
}

document.getElementById('btn-geocode').addEventListener('click', async function() {
  var address = document.getElementById('f-address').value.trim();
  if (!address) { document.getElementById('geocode-status').textContent = '住所を入力してください'; return; }
  var status = document.getElementById('geocode-status');
  status.textContent = '取得中...';
  try {
    var coords = await geocodeAddress(address);
    document.getElementById('f-lat').value = coords.lat.toFixed(6);
    document.getElementById('f-lng').value = coords.lng.toFixed(6);
    status.textContent = '✓ 緯度: ' + coords.lat.toFixed(6) + '　経度: ' + coords.lng.toFixed(6);
    onLatLngReady(coords.lat, coords.lng);
  } catch(e) {
    status.textContent = '⚠ ' + e.message;
  }
});

// ---- Overpass 距離取得 ----
var OVERPASS_QUERIES = {
  supermarket_dist_m:        '["shop"~"supermarket|grocery"]',
  hospital_dist_m:           '["amenity"~"hospital|clinic"]',
  convenience_store_dist_m:  '["shop"="convenience"]',
  park_dist_m:               '["leisure"="park"]',
  school_dist_m:             '["amenity"~"school|kindergarten"]',
};

function haversineM(lat1, lng1, lat2, lng2) {
  var R = 6371000;
  var toRad = function(d) { return d * Math.PI / 180; };
  var phi1 = toRad(lat1), phi2 = toRad(lat2);
  var dphi = toRad(lat2 - lat1), dlambda = toRad(lng2 - lng1);
  var a = Math.sin(dphi/2)**2 + Math.cos(phi1)*Math.cos(phi2)*Math.sin(dlambda/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function fetchNearestDist(lat, lng, osmFilter, radiusM) {
  radiusM = radiusM || 2000;
  var query = '[out:json][timeout:20];node' + osmFilter + '(around:' + radiusM + ',' + lat + ',' + lng + ');out body 10;';
  var url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);
  var res = await fetch(url);
  if (!res.ok) throw new Error('Overpass HTTP ' + res.status);
  var data = await res.json();
  if (!data.elements || data.elements.length === 0) return null;
  var dists = data.elements.map(function(el) { return haversineM(lat, lng, el.lat, el.lon); });
  return Math.round(Math.min.apply(null, dists));
}

async function fetchAllDistances(lat, lng) {
  var status = document.getElementById('dist-status');
  status.textContent = '🔍 周辺施設の距離を取得中...';
  var results = {};
  var keys = Object.keys(OVERPASS_QUERIES);
  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];
    try {
      results[key] = await fetchNearestDist(lat, lng, OVERPASS_QUERIES[key]);
      if (i < keys.length - 1) await new Promise(function(r) { setTimeout(r, 1000); }); // 1秒待機
    } catch(e) {
      results[key] = null;
    }
  }
  // 画面に反映
  var labels = { supermarket_dist_m: 'スーパー', hospital_dist_m: '病院', convenience_store_dist_m: 'コンビニ', park_dist_m: '公園', school_dist_m: '学校' };
  var parts = keys.map(function(k) {
    return labels[k] + ': ' + (results[k] != null ? results[k] + 'm' : '不明');
  });
  status.textContent = '✓ ' + parts.join('　');
  return results;
}

// 緯度経度確定後に距離を自動取得する共通関数
async function onLatLngReady(lat, lng) {
  var distRes = await fetchAllDistances(lat, lng);
  window._lastDistances = distRes;
  await fetchHazardRisk(lat, lng);
}

// ---- 宇津研ハザードリスク自動取得 ----
function hazardToRisk(loc) {
  var score = 0;
  // 洪水 flood_l2: 0-8 → リスク0-3
  var fl = parseInt(loc.flood_l2) || 0;
  if (fl >= 6) score = Math.max(score, 3);
  else if (fl >= 3) score = Math.max(score, 2);
  else if (fl >= 1) score = Math.max(score, 1);
  // 土砂災害（boolean）
  if (loc.dosekiryukeikaikuiki || loc.kyukeishakeikaikuiki || loc.jisuberikeikaikuiki) score = Math.max(score, 2);
  // 津波
  var ts = parseInt(loc.tsunami_newlegend) || 0;
  if (ts >= 3) score = Math.max(score, 3);
  else if (ts >= 1) score = Math.max(score, 2);
  // 高潮
  var ht = parseInt(loc.hightide) || 0;
  if (ht >= 1) score = Math.max(score, 1);
  return score;
}

async function fetchHazardRisk(lat, lng) {
  var hazardStatus = document.getElementById('geocode-status');
  var hazardField = document.getElementById('f-hazard_risk');
  var prev = hazardStatus.textContent;
  hazardStatus.textContent = prev + '　🔍 ハザード取得中...';
  try {
    var url = 'https://utsuken.sub.jp/hazards/outlines/' + lng + '/' + lat + '/12';
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var loc = data.specified_location || {};
    var risk = hazardToRisk(loc);
    hazardField.value = risk;
    hazardStatus.textContent = prev + '　✓ ハザードリスク: ' + risk + '/5';
  } catch(e) {
    hazardStatus.textContent = prev + '　⚠ ハザード自動取得失敗（手動入力してください）';
  }
}

// ---- Banner ----
function showBanner(msg, type, autoHide) {
  var b = document.getElementById('banner');
  b.innerHTML = msg;
  b.className = 'banner ' + type;
  b.style.display = 'block';
  b.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  if (autoHide) setTimeout(function() { b.style.display = 'none'; }, autoHide);
}
