<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物件コスパランキング</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fff;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    h1 {
      font-size: 1.4rem;
      color: #1a73e8;
      margin-bottom: 4px;
    }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 16px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      background: #1a73e8;
      color: #fff;
      padding: 8px 10px;
      text-align: left;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    th:hover { background: #1558b0; }
    th.sorted-asc::after { content: " ▲"; }
    th.sorted-desc::after { content: " ▼"; }
    td {
      padding: 7px 10px;
      border-bottom: 1px solid #e0e0e0;
    }
    tr:hover td { filter: brightness(0.96); }
    a { color: #1a73e8; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #999;
    }
    @media (max-width: 700px) {
      table { font-size: 0.75rem; }
      td, th { padding: 5px 6px; }
    }
  </style>
</head>
<body>
  <h1>物件コスパランキング</h1>
  <p class="subtitle">コスパ比（スコア÷価格×1000）の高い順。緑＝割安、赤＝割高。</p>
  <table id="rankingTable">
    <thead>
      <tr>
        <th data-col="rank">順位</th>
        <th data-col="name">物件名</th>
        <th data-col="price">価格（万円）</th>
        <th data-col="score">スコア</th>
        <th data-col="cospa">コスパ比</th>
        <th data-col="deviation">乖離率</th>
        <th data-col="walk">駅徒歩（分）</th>
        <th data-col="age">築年数</th>
        <th data-col="area">面積（㎡）</th>
        <th data-col="station">最寄り駅</th>
        <th data-col="pet">ペット可</th>
        <th data-col="memo">メモ</th>
      </tr>
    </thead>
    <tbody>
      
        <tr style="" data-cospa="0.159837"
            data-score="0.43"
            data-price="2690"
            data-deviation="0"
            data-walk="3"
            data-age="53"
            data-area="38.34"
            data-rank="1">
          <td>1</td>
          <td><a href="https://suumo.jp/ms/chuko/tokyo/sc_suginami/nc_20588693/" target="_blank">方南町サーラ</a></td>
          <td>2690</td>
          <td>0.430</td>
          <td>0.16</td>
          <td>—</td>
          <td>3</td>
          <td>53</td>
          <td>38.34</td>
          <td>方南町</td>
          <td>✓</td>
          <td></td>
        </tr>
        <tr style="" data-cospa="0.093625"
            data-score="0.543"
            data-price="5800"
            data-deviation="0"
            data-walk="7"
            data-age="12"
            data-area="65.5"
            data-rank="2">
          <td>2</td>
          <td><a href="https://suumo.jp/ms/chuko/tokyo/..." target="_blank">サンプルマンション301</a></td>
          <td>5800</td>
          <td>0.543</td>
          <td>0.09</td>
          <td>—</td>
          <td>7</td>
          <td>12</td>
          <td>65.5</td>
          <td>渋谷</td>
          <td>✓</td>
          <td></td>
        </tr>
    </tbody>
  </table>
  <footer>最終更新: 2026-06-08 10:10:29</footer>
  <script>
    (function() {
      const table = document.getElementById('rankingTable');
      const tbody = table.querySelector('tbody');
      const colMap = {
        rank: 'rank', name: null, price: 'price', score: 'score',
        cospa: 'cospa', deviation: 'deviation', walk: 'walk',
        age: 'age', area: 'area', station: null, pet: null, memo: null
      };
      let sortCol = 'cospa';
      let sortAsc = false;

      function updateHeaders() {
        table.querySelectorAll('th').forEach(th => {
          th.classList.remove('sorted-asc', 'sorted-desc');
          if (th.dataset.col === sortCol) {
            th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
          }
        });
      }

      function sortTable(col) {
        const attr = colMap[col];
        if (!attr) return;
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = false; }
        const rows = Array.from(tbody.querySelectorAll('tr'));
        rows.sort((a, b) => {
          const av = parseFloat(a.dataset[attr]) || 0;
          const bv = parseFloat(b.dataset[attr]) || 0;
          return sortAsc ? av - bv : bv - av;
        });
        rows.forEach(r => tbody.appendChild(r));
        updateHeaders();
      }

      table.querySelectorAll('th').forEach(th => {
        th.addEventListener('click', () => sortTable(th.dataset.col));
      });

      updateHeaders();
    })();
  </script>
</body>
</html>
