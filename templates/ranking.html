<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物件コスパランキング</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f3f4f6;color:#1f2937;}
.container{max-width:1200px;margin:0 auto;padding:16px;}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:20px;margin-bottom:16px;}
.hdr{display:flex;align-items:center;justify-content:space-between;}
h1{font-size:1.4rem;font-weight:700;color:#2563eb;}
.btn{display:inline-block;padding:6px 14px;border-radius:6px;font-size:.85rem;font-weight:600;cursor:pointer;border:none;transition:background .15s;}
.btn-sec{background:#f3f4f6;color:#374151;border:1px solid #d1d5db;}.btn-sec:hover{background:#e5e7eb;}
.btn-sm{padding:3px 8px;font-size:.75rem;}
.btn-del{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}.btn-del:hover{background:#fecaca;}
a{color:#2563eb;text-decoration:none;}a:hover{text-decoration:underline;}

/* accordion */
.sec-hdr{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#6b7280;
  cursor:pointer;padding:10px 0 6px;border-bottom:1px solid #e5e7eb;margin-bottom:10px;user-select:none;
  display:flex;align-items:center;justify-content:space-between;}
.sec-hdr:hover{color:#374151;}
.sec-hdr .arr{font-size:.7rem;transition:transform .2s;}
.sec-hdr.open .arr{transform:rotate(90deg);}
.sec-body{margin-bottom:16px;}
.sec-body.closed{display:none;}

/* weight rows */
.w-row{display:grid;grid-template-columns:110px 1fr 68px;gap:8px;align-items:center;margin-bottom:6px;font-size:.85rem;}
.w-row input[type=range]{width:100%;accent-color:#2563eb;}
input[type=number]{border:1px solid #d1d5db;border-radius:4px;padding:3px 6px;font-size:.83rem;width:100%;}
input[type=text]{border:1px solid #d1d5db;border-radius:4px;padding:3px 6px;font-size:.83rem;width:100%;}

/* norm rows */
.n-row{display:grid;grid-template-columns:150px 36px 62px 36px 62px;gap:6px;align-items:center;margin-bottom:4px;font-size:.84rem;}
.n-hint{font-size:.72rem;color:#9ca3af;margin-bottom:10px;margin-left:4px;}
.n-lbl{color:#6b7280;font-size:.8rem;}

/* step table */
.step-tbl{width:100%;border-collapse:collapse;font-size:.84rem;margin-bottom:8px;}
.step-tbl th{background:#f9fafb;color:#6b7280;font-size:.75rem;font-weight:600;padding:5px 8px;text-align:left;}
.step-tbl td{padding:3px 6px;border-bottom:1px solid #f3f4f6;}
.step-tbl input[type=number]{width:100%;}

/* direction grid */
.dir-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.dir-item{display:flex;align-items:center;gap:6px;font-size:.85rem;}
.dir-item span{min-width:28px;}
.dir-item input{flex:1;max-width:60px;}

/* terminal table */
.term-tbl{width:100%;border-collapse:collapse;font-size:.83rem;margin-bottom:8px;}
.term-tbl th{background:#f9fafb;color:#6b7280;font-size:.75rem;font-weight:600;padding:5px 8px;text-align:left;}
.term-tbl td{padding:3px 6px;border-bottom:1px solid #f3f4f6;}

/* ranking table */
table.rank{width:100%;border-collapse:collapse;font-size:.88rem;}
table.rank th{background:#2563eb;color:#fff;padding:8px 10px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none;}
table.rank th:hover{background:#1d4ed8;}
table.rank th.asc::after{content:' ▲';}
table.rank th.desc::after{content:' ▼';}
table.rank td{padding:7px 10px;border-bottom:1px solid #e5e7eb;white-space:nowrap;}
table.rank tr:hover td{background:#f9fafb;}
.no-data{text-align:center;color:#9ca3af;padding:40px;}
.foot{color:#9ca3af;font-size:.75rem;text-align:right;margin-top:8px;}
.count{color:#6b7280;font-size:.84rem;margin-bottom:10px;}

.filter-row{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-bottom:8px;}
.filter-row input[type=checkbox]{accent-color:#2563eb;width:16px;height:16px;}

@media(max-width:640px){
  .w-row{grid-template-columns:90px 1fr 52px;}
  table.rank{font-size:.74rem;}
  table.rank td,table.rank th{padding:5px 6px;}
  .dir-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>
<div class="container">

<div class="card">
  <div class="hdr">
    <h1>物件コスパランキング</h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-sec" id="settings-toggle">⚙ 設定</button>
      <a href="index.html">← 物件登録</a>
    </div>
  </div>
</div>

<div class="card" id="settings-panel" style="display:none">

  <!-- ハードフィルター -->
  <div class="sec-hdr open" data-sec="sec-filter">ハードフィルター <span class="arr">▶</span></div>
  <div class="sec-body" id="sec-filter">
    <div class="filter-row">
      <input type="checkbox" id="pet-filter">
      <label for="pet-filter">ペット可を必須にする</label>
    </div>
  </div>

  <!-- 重み -->
  <div class="sec-hdr open" data-sec="sec-weights">重み（スライダー） <span class="arr">▶</span></div>
  <div class="sec-body" id="sec-weights"></div>

  <!-- 正規化レンジ -->
  <div class="sec-hdr" data-sec="sec-norm">正規化レンジ <span class="arr">▶</span></div>
  <div class="sec-body closed" id="sec-norm"></div>

  <!-- 面積ステップ -->
  <div class="sec-hdr" data-sec="sec-area">面積ステップスコア <span class="arr">▶</span></div>
  <div class="sec-body closed" id="sec-area"></div>

  <!-- 築年数ステップ -->
  <div class="sec-hdr" data-sec="sec-age">築年数ステップスコア <span class="arr">▶</span></div>
  <div class="sec-body closed" id="sec-age"></div>

  <!-- ハザードリスクステップ -->
  <div class="sec-hdr" data-sec="sec-hazard">ハザードリスクステップスコア <span class="arr">▶</span></div>
  <div class="sec-body closed" id="sec-hazard"></div>

  <!-- 方角スコア -->
  <div class="sec-hdr" data-sec="sec-dir">方角スコア <span class="arr">▶</span></div>
  <div class="sec-body closed" id="sec-dir"></div>

  <!-- ターミナル駅 -->
  <div class="sec-hdr" data-sec="sec-term">ターミナル駅 <span class="arr">▶</span></div>
  <div class="sec-body closed" id="sec-term"></div>

  <div style="margin-top:8px;">
    <button class="btn btn-del btn-sm" onclick="doReset()">デフォルトに戻す</button>
  </div>
</div>

<div class="card">
  <div class="count" id="rank-count"></div>
  <div style="overflow-x:auto;">
    <table class="rank" id="rank-table">
      <thead><tr>
        <th data-k="rank">順位</th>
        <th data-k="name">物件名</th>
        <th data-k="price_man">価格（万円）</th>
        <th data-k="score">スコア</th>
        <th data-k="cospa">コスパ比</th>
        <th data-k="walk">駅徒歩（分）</th>
        <th data-k="age">築年数</th>
        <th data-k="area">面積（㎡）</th>
        <th data-k="station">最寄り駅</th>
        <th data-k="pet">ペット可</th>
        <th data-k="memo">メモ</th>
      </tr></thead>
      <tbody id="rank-body"></tbody>
    </table>
  </div>
  <div class="foot" id="rank-foot"></div>
</div>

</div><!-- /container -->
<script>
// ===== INJECTED DATA =====
var PROPERTIES = /* __PROPERTIES__ */[];
var GENERATED  = /* __GENERATED__ */"";

// ===== DEFAULT CONFIG =====
var DEFAULT_CONFIG = {
  pet_filter: true,
  weights: {
    area_m2:                  0.30,
    walk_to_station:          0.10,
    terminal_access:          0.10,
    supermarket_dist_m:       0.10,
    hospital_dist_m:          0.07,
    convenience_store_dist_m: 0.04,
    park_dist_m:              0.03,
    school_dist_m:            0.03,
    age_years:                0.07,
    floor_level:              0.04,
    direction:                0.04,
    monthly_fee_man:          0.05,
    hazard_risk:              0.05,
    renovation:               0.04,
    auto_lock:                0.03,
    elevator:                 0.02,
    bike_parking:             0.01,
    delivery_box:             0.02,
    bathroom_dryer:           0.015,
    walk_in_closet:           0.015
  },
  normalization: {
    walk_to_station:          {min:1,    max:15,    invert:true},
    floor_level:              {min:1,    max:30,    invert:false},
    supermarket_dist_m:       {min:50,   max:1000,  invert:true},
    hospital_dist_m:          {min:50,   max:2000,  invert:true},
    convenience_store_dist_m: {min:50,   max:500,   invert:true},
    park_dist_m:              {min:50,   max:800,   invert:true},
    school_dist_m:            {min:50,   max:1000,  invert:true},
    terminal_access:          {min:1000, max:15000, invert:true},
    monthly_fee_man:          {min:1,    max:10,    invert:true}
  },
  area_steps: [
    {max:30, score:0.00},{max:35, score:0.10},{max:40, score:0.35},
    {max:50, score:0.50},{max:60, score:0.75},{max:999,score:1.00}
  ],
  age_steps: [
    {max:10, score:1.00},{max:20, score:0.75},{max:30, score:0.50},
    {max:44, score:0.25},{max:999,score:0.00}
  ],
  hazard_steps: [
    {max:0, score:1.00},{max:1, score:0.70},{max:2, score:0.40},{max:5, score:0.00}
  ],
  direction_scores: {
    '南':1.0,'南東':0.9,'南西':0.9,'東':0.7,'西':0.6,'北東':0.4,'北西':0.4,'北':0.3
  },
  terminals: [
    {name:'渋谷',lat:35.6580,lng:139.7016},{name:'新宿',lat:35.6896,lng:139.7006},
    {name:'銀座',lat:35.6717,lng:139.7650},{name:'池袋',lat:35.7295,lng:139.7109},
    {name:'東京',lat:35.6812,lng:139.7671},{name:'品川',lat:35.6284,lng:139.7387}
  ]
};

var WEIGHT_LABELS = {
  area_m2:'面積', walk_to_station:'駅徒歩', terminal_access:'ターミナル駅',
  supermarket_dist_m:'スーパー', hospital_dist_m:'病院',
  convenience_store_dist_m:'コンビニ', park_dist_m:'公園', school_dist_m:'学校',
  age_years:'築年数', floor_level:'階数', direction:'方角',
  monthly_fee_man:'管理費+修繕積立', hazard_risk:'ハザードリスク',
  renovation:'リノベ', auto_lock:'オートロック', elevator:'EV',
  bike_parking:'駐輪場', delivery_box:'宅配ボックス',
  bathroom_dryer:'浴室乾燥機', walk_in_closet:'WIC'
};

var NORM_META = {
  walk_to_station:          {label:'駅徒歩（分）',             hint:'小さいほど高得点'},
  floor_level:              {label:'階数',                     hint:'大きいほど高得点'},
  supermarket_dist_m:       {label:'スーパー（m）',            hint:'小さいほど高得点'},
  hospital_dist_m:          {label:'病院（m）',                hint:'小さいほど高得点'},
  convenience_store_dist_m: {label:'コンビニ（m）',            hint:'小さいほど高得点'},
  park_dist_m:              {label:'公園（m）',                hint:'小さいほど高得点'},
  school_dist_m:            {label:'学校（m）',                hint:'小さいほど高得点'},
  terminal_access:          {label:'ターミナル駅距離（m）',    hint:'小さいほど高得点'},
  monthly_fee_man:          {label:'管理費+修繕積立（万円/月）', hint:'小さいほど高得点'}
};

var DIRS = ['南','南東','南西','東','西','北東','北西','北'];

// ===== CONFIG PERSISTENCE =====
var LS_KEY = 'rep-config-v3';

function clone(o){return JSON.parse(JSON.stringify(o));}

function loadCfg(){
  try{
    var s=localStorage.getItem(LS_KEY);
    return s?JSON.parse(s):clone(DEFAULT_CONFIG);
  }catch(e){return clone(DEFAULT_CONFIG);}
}
function saveCfg(cfg){localStorage.setItem(LS_KEY,JSON.stringify(cfg));}

// ===== SCORING ENGINE =====
function normalize(v,min,max,invert){
  if(max===min)return 0.5;
  var n=Math.max(0,Math.min(1,(v-min)/(max-min)));
  return invert?1-n:n;
}

function stepScore(v,steps){
  for(var i=0;i<steps.length;i++) if(v<=steps[i].max) return steps[i].score;
  return steps[steps.length-1].score;
}

function haversine(lat1,lng1,lat2,lng2){
  var R=6371000,p=Math.PI/180;
  var phi1=lat1*p,phi2=lat2*p,dp=(lat2-lat1)*p,dl=(lng2-lng1)*p;
  var a=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(phi1)*Math.cos(phi2)*Math.sin(dl/2)*Math.sin(dl/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function termScore(prop,cfg){
  if(prop.lat==null||prop.lng==null||!cfg.terminals.length)return null;
  var dists=cfg.terminals.map(function(t){return haversine(prop.lat,prop.lng,t.lat,t.lng);});
  var avg=dists.reduce(function(a,b){return a+b;},0)/dists.length;
  var c=cfg.normalization.terminal_access;
  return normalize(avg,c.min,c.max,c.invert);
}

function passesFilter(prop,cfg){
  if(cfg.pet_filter&&!prop.pet_allowed)return false;
  return true;
}

function scoreProp(prop,cfg){
  var sc={},norm=cfg.normalization;
  function n(k){
    var v=prop[k]; if(v==null)return null;
    var c=norm[k]; if(!c)return null;
    return normalize(parseFloat(v),c.min,c.max,c.invert);
  }
  sc.walk_to_station=n('walk_to_station');
  sc.floor_level=n('floor_level');
  sc.supermarket_dist_m=n('supermarket_dist_m');
  sc.hospital_dist_m=n('hospital_dist_m');
  sc.convenience_store_dist_m=n('convenience_store_dist_m');
  sc.park_dist_m=n('park_dist_m');
  sc.school_dist_m=n('school_dist_m');
  sc.monthly_fee_man=n('monthly_fee_man');
  sc.area_m2=prop.area_m2!=null?stepScore(parseFloat(prop.area_m2),cfg.area_steps):null;
  sc.age_years=prop.age_years!=null?stepScore(parseFloat(prop.age_years),cfg.age_steps):null;
  sc.hazard_risk=prop.hazard_risk!=null&&cfg.hazard_steps&&cfg.hazard_steps.length?stepScore(parseFloat(prop.hazard_risk),cfg.hazard_steps):null;
  sc.terminal_access=termScore(prop,cfg);
  sc.direction=prop.direction!=null?(cfg.direction_scores[prop.direction]!=null?cfg.direction_scores[prop.direction]:null):null;
  ['renovation','delivery_box','bathroom_dryer','walk_in_closet','auto_lock','elevator','bike_parking'].forEach(function(k){
    var v=prop[k]; sc[k]=v===true?1.0:v===false?0.0:null;
  });

  var tw=0,ws=0;
  Object.keys(cfg.weights).forEach(function(k){
    var s=sc[k],w=parseFloat(cfg.weights[k])||0;
    if(s!=null&&w>0){ws+=w*s;tw+=w;}
  });
  var score=tw>0?ws/tw:null;
  var price=prop.price_man?parseFloat(prop.price_man):null;
  var cospa=(score!=null&&price)?score/price*1000:null;
  return {
    prop:prop,
    score:score!=null?Math.round(score*10000)/10000:null,
    cospa:cospa!=null?Math.round(cospa*100000)/100000:null
  };
}

// ===== UI BUILDERS =====

// accordion
document.querySelectorAll('.sec-hdr').forEach(function(hdr){
  hdr.addEventListener('click',function(){
    var body=document.getElementById(this.dataset.sec);
    var isOpen=!body.classList.contains('closed');
    body.classList.toggle('closed',isOpen);
    this.classList.toggle('open',!isOpen);
  });
});

function buildWeights(cfg){
  var c=document.getElementById('sec-weights');
  c.innerHTML='';
  Object.keys(WEIGHT_LABELS).forEach(function(k){
    var v=cfg.weights[k]!=null?cfg.weights[k]:0;
    var row=document.createElement('div');
    row.className='w-row';
    row.innerHTML=
      '<span>'+WEIGHT_LABELS[k]+'</span>'+
      '<input type="range" min="0" max="1" step="0.005" value="'+v+'" data-wk="'+k+'" class="wsl">'+
      '<input type="number" min="0" max="1" step="0.005" value="'+v.toFixed(3)+'" data-wk="'+k+'" class="wnum">';
    c.appendChild(row);
  });
  c.querySelectorAll('.wsl').forEach(function(sl){
    sl.addEventListener('input',function(){
      var k=this.dataset.wk;
      c.querySelector('.wnum[data-wk="'+k+'"]').value=parseFloat(this.value).toFixed(3);
      recalc();
    });
  });
  c.querySelectorAll('.wnum').forEach(function(inp){
    inp.addEventListener('change',function(){
      var k=this.dataset.wk;
      c.querySelector('.wsl[data-wk="'+k+'"]').value=this.value;
      recalc();
    });
  });
}

function buildNorm(cfg){
  var c=document.getElementById('sec-norm');
  c.innerHTML='';
  Object.keys(NORM_META).forEach(function(k){
    var m=NORM_META[k],cv=cfg.normalization[k]||{min:0,max:100};
    var row=document.createElement('div');
    row.className='n-row';
    row.innerHTML=
      '<span>'+m.label+'</span>'+
      '<span class="n-lbl">min</span>'+
      '<input type="number" value="'+cv.min+'" data-nk="'+k+'" data-nf="min" class="ni">'+
      '<span class="n-lbl">max</span>'+
      '<input type="number" value="'+cv.max+'" data-nk="'+k+'" data-nf="max" class="ni">';
    c.appendChild(row);
    var hint=document.createElement('div');
    hint.className='n-hint';
    hint.textContent=m.hint;
    c.appendChild(hint);
  });
  c.querySelectorAll('.ni').forEach(function(inp){inp.addEventListener('change',recalc);});
}

function buildStepTable(type,cfg){
  var secId='sec-'+type;
  var steps=type==='area'?cfg.area_steps:type==='age'?cfg.age_steps:cfg.hazard_steps;
  var col=type==='area'?'上限（㎡）':type==='age'?'上限（年）':'上限（リスク値）';
  var c=document.getElementById(secId);
  c.innerHTML='';
  var tbl=document.createElement('table');
  tbl.className='step-tbl';
  tbl.id='stbl-'+type;
  tbl.innerHTML='<thead><tr><th>'+col+'</th><th>スコア (0〜1)</th><th></th></tr></thead><tbody></tbody>';
  c.appendChild(tbl);
  steps.forEach(function(s){addStepRow(type,s.max,s.score);});
  var btn=document.createElement('button');
  btn.className='btn btn-sec btn-sm';
  btn.style.marginTop='4px';
  btn.textContent='+ 行を追加';
  btn.onclick=function(){addStepRow(type,0,0);};
  c.appendChild(btn);
}

function addStepRow(type,maxVal,scoreVal){
  var tbody=document.querySelector('#stbl-'+type+' tbody');
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td><input type="number" value="'+maxVal+'" class="sr-max" min="0" step="1"></td>'+
    '<td><input type="number" value="'+scoreVal+'" class="sr-sc" min="0" max="1" step="0.05"></td>'+
    '<td><button class="btn btn-del btn-sm sr-del">×</button></td>';
  tbody.appendChild(tr);
  tr.querySelector('.sr-max').addEventListener('change',recalc);
  tr.querySelector('.sr-sc').addEventListener('change',recalc);
  tr.querySelector('.sr-del').addEventListener('click',function(){tr.remove();recalc();});
}

function buildDirGrid(cfg){
  var c=document.getElementById('sec-dir');
  c.innerHTML='';
  var grid=document.createElement('div');
  grid.className='dir-grid';
  DIRS.forEach(function(d){
    var v=cfg.direction_scores[d]!=null?cfg.direction_scores[d]:0;
    var item=document.createElement('div');
    item.className='dir-item';
    item.innerHTML='<span>'+d+'</span><input type="number" min="0" max="1" step="0.1" value="'+v+'" data-dir="'+d+'">';
    grid.appendChild(item);
  });
  c.appendChild(grid);
  c.querySelectorAll('input').forEach(function(inp){inp.addEventListener('change',recalc);});
}

function buildTermTable(cfg){
  var c=document.getElementById('sec-term');
  c.innerHTML='';
  var tbl=document.createElement('table');
  tbl.className='term-tbl';
  tbl.id='term-tbl';
  tbl.innerHTML='<thead><tr><th>駅名</th><th>緯度</th><th>経度</th><th></th></tr></thead><tbody></tbody>';
  c.appendChild(tbl);
  cfg.terminals.forEach(function(t){addTermRow(t.name,t.lat,t.lng);});
  var btn=document.createElement('button');
  btn.className='btn btn-sec btn-sm';
  btn.style.marginTop='4px';
  btn.textContent='+ 駅を追加';
  btn.onclick=function(){addTermRow('',35.0,139.0);};
  c.appendChild(btn);
}

function addTermRow(name,lat,lng){
  var tbody=document.querySelector('#term-tbl tbody');
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td><input type="text" value="'+esc(name)+'" class="tr-name"></td>'+
    '<td><input type="number" value="'+lat+'" class="tr-lat" step="0.0001"></td>'+
    '<td><input type="number" value="'+lng+'" class="tr-lng" step="0.0001"></td>'+
    '<td><button class="btn btn-del btn-sm tr-del">×</button></td>';
  tbody.appendChild(tr);
  tr.querySelector('.tr-name').addEventListener('change',recalc);
  tr.querySelector('.tr-lat').addEventListener('change',recalc);
  tr.querySelector('.tr-lng').addEventListener('change',recalc);
  tr.querySelector('.tr-del').addEventListener('click',function(){tr.remove();recalc();});
}

function buildUI(cfg){
  document.getElementById('pet-filter').checked=!!cfg.pet_filter;
  buildWeights(cfg);
  buildNorm(cfg);
  buildStepTable('area',cfg);
  buildStepTable('age',cfg);
  buildStepTable('hazard',cfg);
  buildDirGrid(cfg);
  buildTermTable(cfg);
}

// ===== READ CONFIG FROM DOM =====
function readCfg(){
  var cfg={};
  cfg.pet_filter=document.getElementById('pet-filter').checked;

  cfg.weights={};
  document.querySelectorAll('.wnum').forEach(function(inp){
    cfg.weights[inp.dataset.wk]=parseFloat(inp.value)||0;
  });

  cfg.normalization={};
  Object.keys(NORM_META).forEach(function(k){
    var mi=document.querySelector('.ni[data-nk="'+k+'"][data-nf="min"]');
    var ma=document.querySelector('.ni[data-nk="'+k+'"][data-nf="max"]');
    var def=DEFAULT_CONFIG.normalization[k];
    cfg.normalization[k]={
      min:mi?parseFloat(mi.value):def.min,
      max:ma?parseFloat(ma.value):def.max,
      invert:def.invert
    };
  });

  function readSteps(type){
    var rows=document.querySelectorAll('#stbl-'+type+' tbody tr');
    var steps=[];
    rows.forEach(function(tr){
      var mx=tr.querySelector('.sr-max'),sc=tr.querySelector('.sr-sc');
      if(mx&&sc) steps.push({max:parseFloat(mx.value)||0,score:parseFloat(sc.value)||0});
    });
    steps.sort(function(a,b){return a.max-b.max;});
    return steps;
  }
  cfg.area_steps=readSteps('area');
  cfg.age_steps=readSteps('age');
  cfg.hazard_steps=readSteps('hazard');
  if(!cfg.hazard_steps.length) cfg.hazard_steps=clone(DEFAULT_CONFIG.hazard_steps);

  cfg.direction_scores={};
  document.querySelectorAll('#sec-dir input[data-dir]').forEach(function(inp){
    cfg.direction_scores[inp.dataset.dir]=parseFloat(inp.value)||0;
  });

  cfg.terminals=[];
  document.querySelectorAll('#term-tbl tbody tr').forEach(function(tr){
    var n=tr.querySelector('.tr-name').value.trim();
    var la=parseFloat(tr.querySelector('.tr-lat').value);
    var ln=parseFloat(tr.querySelector('.tr-lng').value);
    if(n&&!isNaN(la)&&!isNaN(ln)) cfg.terminals.push({name:n,lat:la,lng:ln});
  });

  return cfg;
}

// ===== RANKING TABLE =====
var sortK='cospa',sortAsc=false;

function buildTable(results){
  var tbody=document.getElementById('rank-body');
  var countEl=document.getElementById('rank-count');

  if(!results.length){
    tbody.innerHTML='<tr><td colspan="11" class="no-data">表示できる物件がありません</td></tr>';
    countEl.textContent='';
    return;
  }

  results.sort(function(a,b){
    var av=a[sortK]!=null?a[sortK]:(sortAsc?Infinity:-Infinity);
    var bv=b[sortK]!=null?b[sortK]:(sortAsc?Infinity:-Infinity);
    return sortAsc?av-bv:bv-av;
  });

  countEl.textContent=results.length+'件';
  tbody.innerHTML='';
  results.forEach(function(r,i){
    var p=r.prop;
    var nameHtml=p.source_url
      ?'<a href="'+esc(p.source_url)+'" target="_blank">'+esc(p.name||'')+'</a>'
      :esc(p.name||'');
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td>'+(i+1)+'</td>'+
      '<td>'+nameHtml+'</td>'+
      '<td>'+(p.price_man!=null?p.price_man:'—')+'</td>'+
      '<td>'+(r.score!=null?r.score.toFixed(3):'—')+'</td>'+
      '<td>'+(r.cospa!=null?r.cospa.toFixed(4):'—')+'</td>'+
      '<td>'+(p.walk_to_station!=null?p.walk_to_station:'—')+'</td>'+
      '<td>'+(p.age_years!=null?p.age_years:'—')+'</td>'+
      '<td>'+(p.area_m2!=null?p.area_m2:'—')+'</td>'+
      '<td>'+esc(p.station_name||'—')+'</td>'+
      '<td>'+(p.pet_allowed===true?'✓':p.pet_allowed===false?'✗':'—')+'</td>'+
      '<td>'+esc(p.memo||'')+'</td>';
    tbody.appendChild(tr);
  });

  document.querySelectorAll('table.rank th').forEach(function(th){
    th.classList.remove('asc','desc');
    if(th.dataset.k===sortK) th.classList.add(sortAsc?'asc':'desc');
  });
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== MAIN =====
function recalc(){
  var cfg=readCfg();
  saveCfg(cfg);
  var results=PROPERTIES
    .filter(function(p){return passesFilter(p,cfg);})
    .map(function(p){return scoreProp(p,cfg);});
  buildTable(results);
}

function doReset(){
  if(!confirm('設定をデフォルトに戻しますか？'))return;
  localStorage.removeItem(LS_KEY);
  var cfg=clone(DEFAULT_CONFIG);
  buildUI(cfg);
  recalc();
}

// sort on header click
document.querySelectorAll('table.rank th').forEach(function(th){
  th.addEventListener('click',function(){
    var k=this.dataset.k;
    if(!k||k==='name'||k==='station'||k==='pet'||k==='memo')return;
    if(sortK===k){sortAsc=!sortAsc;}else{sortK=k;sortAsc=false;}
    recalc();
  });
});

// settings panel toggle
document.getElementById('settings-toggle').addEventListener('click',function(){
  var p=document.getElementById('settings-panel');
  p.style.display=p.style.display==='none'?'block':'none';
});

document.getElementById('pet-filter').addEventListener('change',recalc);

// boot
document.getElementById('rank-foot').textContent='更新: '+GENERATED;
var _cfg=loadCfg();
buildUI(_cfg);
recalc();
</script>
