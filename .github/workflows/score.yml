name: Score and Render Ranking

on:
  push:
    branches:
      - main
    paths:
      - 'properties/**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render ranking
        run: python render.py

      - name: Commit and push ranking.html
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/ranking.html
          if git diff --cached --quiet; then
            echo "No changes to ranking.html, skipping commit."
          else
            git commit -m "chore: update ranking.html [skip ci]"
            git push
          fi
